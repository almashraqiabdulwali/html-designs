<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج تسجيل دخول - عبدالولي المشرقي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            direction: rtl;
        }

        h1 {
            text-decoration: underline;
            color: #333;
            text-align: right;
        }

        h3 {
            color: #555;
            text-align: right;
        }
        
        /* 1. تنسيق الجدول الأساسي ليلبي طلبك */
        .form-table {
            width: 500px; /* تحديد عرض ثابت أو نسبي للجدول */
            border-collapse: collapse;
            /* طلبك: table بدون border */
            border: none; 
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* لإضافة تجسيم خفيف بدون حدود */
            background-color: #ffffff;
        }

        .form-table td {
            padding: 8px;
            /* طلبك: table بدون border - لذا نجعله شفافاً */
            border: 1px solid transparent; 
        }

        /* 2. تطبيق تقسيم الأعمدة 25% و 75% */
        .label-cell {
            width: 25%; /* العمود الأول 25% */
            text-align: right;
            font-weight: bold;
            color: #1a2a47;
            padding-left: 10px;
        }

        .input-cell {
            width: 75%; /* العمود الثاني 75% */
        }
        
        /* تنسيقات الألوان كما في النموذج الثاني */
        .input-cell input[type="text"],
        .input-cell input[type="password"],
        .input-cell input[type="email"],
        .input-cell input[type="tel"] {
            width: 95%;
            padding: 6px;
            border: 1px solid #aaa;
        }
        
        .row-green {
            background-color: #558B2F; /* لون أخضر داكن للهوايات */
            color: white;
        }

        .row-blue {
            background-color: #318CE7; /* لون أزرق للمؤهل */
            color: white;
        }

        .row-light {
            background-color: silver;
        }
        
        /* تنسيق الأزرار الدائرية والمربعات */
        .options-container label {
            margin-left: 10px;
        }
        
        .submit-btn-cell {
            text-align: left;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    
    <h1>عبدالولي علي عبدالله مقبل المشرقي</h1>
    <h3>الرجاء ملء النموذج التالي للدخول الى بيانات عبدالولي علي عبدالله مقبل المشرقي:</h3>
    
    <form action="#" method="POST">
        <table class="form-table">
            <tbody>
                <tr>
                    <td class="label-cell">الاسم:</td>
                    <td class="input-cell"><input type="text" placeholder="Name"></td>
                </tr>
                
                <tr>
                    <td class="label-cell">كلمة المرور:</td>
                    <td class="input-cell"><input type="password" placeholder="password"></td>
                </tr>
                
                <tr>
                    <td class="label-cell">Email:</td>
                    <td class="input-cell"><input type="email" placeholder="email"></td>
                </tr>
                
                <tr>
                    <td class="label-cell">رقم الهاتف:</td>
                    <td class="input-cell"><input type="tel" placeholder="Tel"></td>
                </tr>

                <tr class="row-light">
                    <td class="label-cell">الجنس:</td>
                    <td class="input-cell options-container">
                        <label>Male</label><input type="radio" value="Male" name="gender">
                        <label>Female</label><input type="radio" value="Female" name="gender">
                    </td>
                </tr>
                
                <tr class="row-green">
                    <td class="label-cell">الهوايات:</td>
                    <td class="input-cell">
                        <input type="checkbox" id="db_protect"><label for="db_protect">حماية قواعد بيانات</label><br>
                        <input type="checkbox" id="prog_train"><label for="prog_train">تدريب دورات برمجيات</label>
                    </td>
                </tr>

                <tr class="row-blue">
                    <td class="label-cell">المؤهل:</td>
                    <td class="input-cell">
                         <select style="width: 100%; padding: 5px;">
                            <option>حماية شبكات</option>
                            <option>برمجة ويب</option>
                            <option>أمن معلومات</option>
                         </select>
                    </td>
                </tr>
                
                <tr>
                    <td colspan="2" class="submit-btn-cell">
                        <button type="submit">click here</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
    
</body>
</html>
