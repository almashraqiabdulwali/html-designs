<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Registration Dashboard | Abdulwali Al-Mashraqi</title>
    <style>
        /* (CSS code will be placed here) */
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="animated-background"></div>

    <div class="dashboard-container">
        
        <header class="glassmorphic-card header-area">
            <h1>لوحة تحكم التسجيل الكبرى ✨</h1>
            <p>مشروع:ENG. ABDULWALI ALI ABDULLAH MOQBEL AL-MASHRAQI</p>
        </header>

        <form class="form-grid" action="#" method="POST">
            
            <div class="glassmorphic-card section auth-section">
                <h2>بيانات المصادقة</h2>
                
                <div class="field-group">
                    <label for="username">اسم المستخدم:</label>
                    <input type="text" id="username" placeholder="اسم مستخدم فريد" required>
                </div>
                
                <div class="field-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" placeholder="بريد إلكتروني فعال" required>
                </div>

                <div class="field-group">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" placeholder="كلمة مرور قوية" required>
                </div>
                
                <div class="field-group">
                    <label for="dob">تاريخ الميلاد:</label>
                    <input type="date" id="dob" required>
                </div>
            </div>

            <div class="glassmorphic-card section skills-section">
                <h2>التخصص والمهارات</h2>

                <div class="field-group">
                    <label for="specialty">التخصص الأكاديمي:</label>
                    <select id="specialty" required>
                        <option value="" disabled selected>اختر تخصصك...</option>
                        <option value="cs">الأمن السيبراني</option>
                        <option value="software">هندسة البرمجيات</option>
                        <option value="networking">شبكات الحاسوب</option>
                    </select>
                </div>
                
                <div class="field-group checkbox-group">
                    <label>الاهتمامات البرمجية:</label>
                    <div class="options-container">
                        <input type="checkbox" id="frontend"><label for="frontend">Front-End (واجهات)</label>
                        <input type="checkbox" id="backend"><label for="backend">Back-End (خوادم)</label>
                        <input type="checkbox" id="database"><label for="database">قواعد بيانات</label>
                    </div>
                </div>

                <div class="field-group range-group">
                    <label for="experience">سنوات الخبرة (0-15):</label>
                    <input type="range" id="experience" min="0" max="15" value="5">
                    <span id="range-value">5 سنوات</span>
                </div>
            </div>

            <div class="glassmorphic-card section attachment-section">
                <h2>المرفقات والملاحظات</h2>

                <div class="field-group">
                    <label for="cv_file">إرفاق السيرة الذاتية (CV):</label>
                    <input type="file" id="cv_file" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="field-group">
                    <label for="color_choice">تفضيل لون الواجهة:</label>
                    <input type="color" id="color_choice" value="#007bff">
                </div>
                
                <div class="field-group">
                    <label for="notes">ملاحظات إضافية:</label>
                    <textarea id="notes" rows="4" placeholder="اكتب أي ملاحظات هنا..."></textarea>
                </div>
            </div>
            
            <div class="submit-area">
                <button type="submit" class="submit-btn">إرسال النموذج والتسجيل الآن</button>
            </div>
            
        </form>
        
    </div>
    
    <script>
        // لربط قيمة السلايدر (Range) وعرضها
        const range = document.getElementById('experience');
        const rangeValue = document.getElementById('range-value');
        range.addEventListener('input', () => {
            rangeValue.textContent = range.value + ' سنوات';
        });
    </script>
</body>
</html>
<style>
    /* الخطوط والألوان */
    :root {
        --primary-light: #4c68ff; /* أزرق فاتح */
        --primary-dark: #00bcd4;  /* تركواز */
        --glass-color: rgba(255, 255, 255, 0.2);
        --glass-border: rgba(255, 255, 255, 0.3);
        --dark-text: #1a2a47;
    }

    body {
        font-family: 'Cairo', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        direction: rtl;
        overflow-x: hidden; /* لمنع ظهور شريط التمرير الأفقي بسبب الخلفية المتحركة */
        perspective: 1500px; /* لتمكين تأثير 3D على مستوى الصفحة */
    }
    
    /* 1. الخلفية المتحركة (تأثير حركة الصفحة) */
    .animated-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        /* تدرج لوني ضخم متحرك */
        background: linear-gradient(135deg, #1f005c, #5b0060, #870160, #ac255e, #ca485c, #e16b5c, #f39060, #ffb568);
        background-size: 400% 400%;
        
        /* حركة بطيئة للخلفية */
        animation: gradient-shift 30s ease infinite;
        z-index: -1;
    }
    @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* 2. حاوية لوحة التحكم والحركة الابتدائية */
    .dashboard-container {
        width: 90%;
        max-width: 1100px;
        margin: 50px auto;
        padding: 30px;
        /* حركة الدخول 3D */
        animation: bounceIn 1.5s ease-out forwards;
        transform-origin: top center;
    }
    @keyframes bounceIn {
        0% { opacity: 0; transform: scale(0.8) translateY(-100px); }
        60% { opacity: 1; transform: scale(1.05) translateY(20px); }
        100% { transform: scale(1) translateY(0); }
    }

    /* 3. تأثير الزجاج (Glassmorphism) */
    .glassmorphic-card {
        background: var(--glass-color);
        backdrop-filter: blur(10px); /* تأثير التغبيش */
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        padding: 25px;
        transition: transform 0.3s ease;
        color: white;
    }
    .glassmorphic-card:hover {
        transform: translateY(-5px) scale(1.01); /* حركة رفع عند المرور */
    }

    /* 4. تطبيق Grid للهيكلة الداخلية */
    .form-grid {
        display: grid;
        /* تقسيم إلى عمودين متساويين */
        grid-template-columns: 1fr 1fr; 
        gap: 30px;
        margin-top: 30px;
    }
    .header-area {
        grid-column: 1 / span 2;
        text-align: center;
        background: linear-gradient(45deg, var(--primary-light), var(--primary-dark));
        color: white;
        padding: 20px;
        margin-bottom: 10px;
    }
    .header-area h1 { margin: 0; font-size: 2.2em; }
    .header-area p { margin: 5px 0 0; font-size: 1em; opacity: 0.8; }
    
    .section h2 {
        color: var(--primary-dark);
        border-bottom: 2px solid var(--glass-border);
        padding-bottom: 10px;
        margin-top: 0;
        margin-bottom: 20px;
    }

    /* 5. تنسيق حقول الإدخال والتحكم في الحركة */
    .field-group {
        margin-bottom: 15px;
    }
    .field-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        box-sizing: border-box;
        background-color: rgba(255, 255, 255, 0.9); /* خلفية فاتحة للحقل */
        color: var(--dark-text);
        transition: transform 0.3s, box-shadow 0.3s;
    }
    input:focus, select:focus, textarea:focus {
        box-shadow: 0 0 0 3px var(--primary-dark);
        transform: scale(1.02); /* حركة تكبير عند التركيز */
        outline: none;
    }

    /* حقل نوع الملف */
    input[type="file"] {
        background-color: rgba(255, 255, 255, 0.7);
        padding: 10px;
    }
    
    /* حقل اللون */
    input[type="color"] {
        height: 40px;
        padding: 0;
        cursor: pointer;
    }

    /* تنسيق Checkbox */
    .checkbox-group .options-container {
        display: flex;
        gap: 20px;
        margin-top: 10px;
    }
    .checkbox-group label {
        display: inline;
        font-weight: 400;
        text-shadow: none;
    }

    /* تنسيق Range Slider وعرض القيمة */
    .range-group #range-value {
        display: block;
        margin-top: 5px;
        font-size: 1.1em;
        font-weight: 700;
        color: var(--primary-dark);
        text-align: center;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    /* 6. تنسيق زر الإرسال */
    .submit-area {
        grid-column: 1 / span 2;
        text-align: center;
        padding-top: 20px;
    }
    .submit-btn {
        padding: 18px 60px;
        font-size: 1.3em;
        font-weight: 700;
        border-radius: 50px;
        cursor: pointer;
        /* تدرج لوني قوي للزر */
        background: linear-gradient(90deg, #ff6b6b, #ee5253); 
        color: white;
        box-shadow: 0 10px 20px rgba(255, 107, 107, 0.5);
        border: 2px solid white;
        transition: all 0.3s ease;
    }
    .submit-btn:hover {
        background: linear-gradient(90deg, #ee5253, #ff6b6b);
        transform: translateY(-5px) rotateX(10deg); /* حركة ضغط ثلاثية الأبعاد */
        box-shadow: 0 15px 30px rgba(255, 107, 107, 0.8);
    }

    /* 7. الاستجابة الكاملة */
    @media (max-width: 900px) {
        .form-grid {
            grid-template-columns: 1fr; /* عمود واحد على الشاشات الأصغر */
            gap: 20px;
        }
        .header-area, .submit-area {
            grid-column: 1 / span 1;
        }
        .dashboard-container {
            padding: 15px;
            margin: 20px auto;
        }
    }
</style>
