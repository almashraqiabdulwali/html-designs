<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mega Registration Dashboard | Abdulwali Al-Mashraqi</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--p-l:#4c68ff;--p-d:#00bcd4;--g-c:rgba(255,255,255,.2);--g-b:rgba(255,255,255,.3);--d-t:#1a2a47}body{font-family:'Cairo',sans-serif;margin:0;padding:0;min-height:100vh;display:flex;justify-content:center;align-items:center;direction:rtl;overflow-x:hidden;perspective:1500px}.animated-bg{position:fixed;top:0;left:0;width:200%;height:200%;background:linear-gradient(135deg,#1f005c,#5b0060,#870160,#ac255e,#ca485c,#e16b5c,#f39060,#ffb568);background-size:400% 400%;animation:g-s 30s ease infinite;z-index:-1}@keyframes g-s{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}.dash-c{width:90%;max-width:1100px;margin:50px auto;padding:30px;animation:b-i 1.5s ease-out forwards;transform-origin:top center}@keyframes b-i{0%{opacity:0;transform:scale(.8) translateY(-100px)}60%{opacity:1;transform:scale(1.05) translateY(20px)}100%{transform:scale(1) translateY(0)}}.g-c{background:var(--g-c);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--g-b);border-radius:18px;box-shadow:0 4px 30px rgba(0,0,0,.1);padding:25px;transition:transform .3s ease;color:#fff}.g-c:hover{transform:translateY(-5px) scale(1.01)}.f-g{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.h-a{grid-column:1/span 2;text-align:center;background:linear-gradient(45deg,var(--p-l),var(--p-d));padding:20px;margin-bottom:10px}.h-a h1{margin:0;font-size:2.2em}.h-a p{margin:5px 0 0;font-size:1em;opacity:.8}.sec h2{color:var(--p-d);border-bottom:2px solid var(--g-b);padding-bottom:10px;margin-top:0;margin-bottom:20px}.f-field{margin-bottom:15px}.f-field label{display:block;margin-bottom:8px;font-weight:700;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.5)}input,select,textarea{width:100%;padding:12px;border:none;border-radius:10px;box-sizing:border-box;background-color:rgba(255,255,255,.9);color:var(--d-t);transition:transform .3s,box-shadow .3s}input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--p-d);transform:scale(1.02);outline:none}input[type="file"]{background-color:rgba(255,255,255,.7);padding:10px}input[type="color"]{height:40px;padding:0;cursor:pointer}.cb-g .o-c{display:flex;gap:20px;margin-top:10px}.cb-g label{display:inline;font-weight:400;text-shadow:none}.r-g #r-v{display:block;margin-top:5px;font-size:1.1em;font-weight:700;color:var(--p-d);text-align:center;text-shadow:1px 1px 2px rgba(0,0,0,.5)}.s-a{grid-column:1/span 2;text-align:center;padding-top:20px}.s-b{padding:18px 60px;font-size:1.3em;font-weight:700;border-radius:50px;cursor:pointer;background:linear-gradient(90deg,#ff6b6b,#ee5253);color:#fff;box-shadow:0 10px 20px rgba(255,107,107,.5);border:2px solid #fff;transition:all .3s ease}.s-b:hover{background:linear-gradient(90deg,#ee5253,#ff6b6b);transform:translateY(-5px) rotateX(10deg);box-shadow:0 15px 30px rgba(255,107,107,.8)}@media (max-width:900px){.f-g{grid-template-columns:1fr;gap:20px}.h-a,.s-a{grid-column:1/span 1}.dash-c{padding:15px;margin:20px auto}}
</style></head><body>

    <div class="animated-bg"></div>

    <div class="dash-c">
        
        <header class="g-c h-a">
            <h1>لوحة تحكم التسجيل الكبرى ✨</h1>
            <p>مشروع:ENG. ABDULWALI ALI ABDULLAH MOQBEL AL-MASHRAQI</p>
        </header>

        <form class="f-g" action="#" method="POST">
            
            <div class="g-c sec auth-section">
                <h2>بيانات المصادقة</h2>
                
                <div class="f-field">
                    <label for="username">اسم المستخدم:</label>
                    <input type="text" id="username" placeholder="اسم مستخدم فريد" required>
                </div>
                
                <div class="f-field">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" placeholder="بريد إلكتروني فعال" required>
                </div>

                <div class="f-field">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" placeholder="كلمة مرور قوية" required>
                </div>
                
                <div class="f-field">
                    <label for="dob">تاريخ الميلاد:</label>
                    <input type="date" id="dob" required>
                </div>
            </div>

            <div class="g-c sec skills-section">
                <h2>التخصص والمهارات</h2>

                <div class="f-field">
                    <label for="specialty">التخصص الأكاديمي:</label>
                    <select id="specialty" required>
                        <option value="" disabled selected>اختر تخصصك...</option>
                        <option value="cs">الأمن السيبراني</option>
                        <option value="software">هندسة البرمجيات</option>
                        <option value="networking">شبكات الحاسوب</option>
                    </select>
                </div>
                
                <div class="f-field cb-g">
                    <label>الاهتمامات البرمجية:</label>
                    <div class="o-c">
                        <input type="checkbox" id="frontend"><label for="frontend">Front-End (واجهات)</label>
                        <input type="checkbox" id="backend"><label for="backend">Back-End (خوادم)</label>
                        <input type="checkbox" id="database"><label for="database">قواعد بيانات</label>
                    </div>
                </div>

                <div class="f-field r-g">
                    <label for="experience">سنوات الخبرة (0-15):</label>
                    <input type="range" id="experience" min="0" max="15" value="5">
                    <span id="r-v">5 سنوات</span>
                </div>
            </div>

            <div class="g-c sec attachment-section">
                <h2>المرفقات والملاحظات</h2>

                <div class="f-field">
                    <label for="cv_file">إرفاق السيرة الذاتية (CV):</label>
                    <input type="file" id="cv_file" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="f-field">
                    <label for="color_choice">تفضيل لون الواجهة:</label>
                    <input type="color" id="color_choice" value="#007bff">
                </div>
                
                <div class="f-field">
                    <label for="notes">ملاحظات إضافية:</label>
                    <textarea id="notes" rows="4" placeholder="اكتب أي ملاحظات هنا..."></textarea>
                </div>
            </div>
            
            <div class="s-a">
                <button type="submit" class="s-b">إرسال النموذج والتسجيل الآن</button>
            </div>
            
        </form>
        
    </div>
    
    <script>
        const range=document.getElementById('experience'),rangeValue=document.getElementById('r-v');range.addEventListener('input',()=>rangeValue.textContent=range.value+' سنوات');
    </script>
</body></html>
